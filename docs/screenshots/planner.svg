<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <rect width="360" height="780" fill="#F8FAFC"/>
  <!-- App Header Bar -->
  <text x="20" y="48" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="800">← Safe Route Planner</text>

  <!-- Core Safety Mandate Box -->
  <rect x="16" y="70" width="328" height="88" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="32" y="92" fill="#0284C7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🛡️ CORE SAFETY MANDATE</text>
  <text x="32" y="110" fill="#0369A1" font-family="system-ui, sans-serif" font-size="10">The goal is the safest good road, not the shortest. Distance</text>
  <text x="32" y="124" fill="#0369A1" font-family="system-ui, sans-serif" font-size="10">and duration do not matter. A longer divided highway is better</text>
  <text x="32" y="138" fill="#0369A1" font-family="system-ui, sans-serif" font-size="10">than a shorter village road, ghat shortcut, or city cut.</text>

  <!-- Origin & Destination Inputs Card -->
  <rect x="16" y="172" width="328" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="32" y="196" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Route Origin &amp; Destination</text>

  <!-- Start Input -->
  <rect x="32" y="210" width="296" height="42" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="48" cy="231" r="9" fill="#0284C7"/>
  <text x="48" y="235" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">S</text>
  <text x="66" y="235" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">Start (Place + City)</text>
  <text x="312" y="236" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">📍</text>

  <!-- Destination Input -->
  <rect x="32" y="262" width="296" height="54" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <circle cx="48" cy="289" r="9" fill="#DC2626"/>
  <text x="48" y="293" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="bold">D</text>
  <text x="66" y="282" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Destination (Place + City /</text>
  <text x="66" y="296" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Landmark)</text>
  <text x="312" y="289" fill="#64748B" font-family="system-ui, sans-serif" font-size="12">📍</text>

  <!-- Specific Requirements Input -->
  <rect x="32" y="326" width="296" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="44" y="349" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Specific trip requirements (Optional)</text>

  <!-- Quick Presets -->
  <text x="32" y="388" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Quick Presets:</text>
  <rect x="32" y="396" width="102" height="20" rx="6" fill="#E0F2FE"/>
  <text x="83" y="410" fill="#0369A1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Chennai → Bengaluru</text>
  <rect x="138" y="396" width="84" height="20" rx="6" fill="#E0F2FE"/>
  <text x="180" y="410" fill="#0369A1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Mumbai → Goa</text>
  <rect x="226" y="396" width="80" height="20" rx="6" fill="#E0F2FE"/>
  <text x="266" y="410" fill="#0369A1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" font-weight="600">Delhi → Jaipur</text>

  <!-- Action Button -->
  <rect x="32" y="432" width="296" height="42" rx="10" fill="#E2E8F0"/>
  <text x="180" y="458" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">🚘 Generate Safe Route</text>

  <!-- Bypass Link -->
  <text x="180" y="504" fill="#0284C7" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="700">Or Bypass AI Billing (Paste/Type Route Text)</text>

  <!-- Bottom Navigation -->
  <rect x="0" y="710" width="360" height="70" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="736" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🏠</text>
  <text x="40" y="760" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Home</text>

  <rect x="84" y="716" width="56" height="32" rx="16" fill="#FCE7F3"/>
  <text x="112" y="736" fill="#DB2777" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🧭</text>
  <text x="112" y="760" fill="#DB2777" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="700">Plan</text>

  <text x="184" y="736" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🔖</text>
  <text x="184" y="760" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Saved</text>

  <text x="256" y="736" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🛡️</text>
  <text x="256" y="760" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">SOS</text>

  <text x="320" y="736" fill="#64748B" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">⚙️</text>
  <text x="320" y="760" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Settings</text>
</svg>