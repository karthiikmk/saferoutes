<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <rect width="320" height="640" rx="28" fill="#121318"/>
  <!-- Status Bar -->
  <text x="24" y="32" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <path d="M280 22h16v10h-16z" fill="#00E676" rx="2"/>
  
  <!-- Header Bar -->
  <rect x="0" y="48" width="320" height="56" fill="#1C1B20"/>
  <text x="20" y="82" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="700">SafeRoutes</text>
  <circle cx="288" cy="76" r="14" fill="#2C2C35"/>
  <text x="288" y="81" fill="#00E676" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">MK</text>

  <!-- Banner -->
  <rect x="16" y="116" width="288" height="110" rx="16" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  <text x="32" y="148" fill="#93C5FD" font-family="Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">AUDITED CORRIDORS</text>
  <text x="32" y="174" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="18" font-weight="800">Chennai → Bengaluru</text>
  <text x="32" y="196" fill="#E0F2FE" font-family="Roboto, sans-serif" font-size="12">NH48 • 346 km • 4-Star Safety</text>

  <!-- Quick Action Chips -->
  <rect x="16" y="238" width="88" height="32" rx="16" fill="#262630"/>
  <text x="60" y="259" fill="#00E676" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="600">🛡️ 4-Lane</text>
  <rect x="112" y="238" width="94" height="32" rx="16" fill="#262630"/>
  <text x="159" y="259" fill="#38BDF8" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="600">☀️ Clear</text>
  <rect x="214" y="238" width="90" height="32" rx="16" fill="#262630"/>
  <text x="259" y="259" fill="#FACD15" font-family="Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="600">⚡ FASTag</text>

  <!-- Section Title -->
  <text x="16" y="298" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="15" font-weight="700">Popular Safe Routes</text>

  <!-- Route Card 1 -->
  <rect x="16" y="312" width="288" height="88" rx="12" fill="#1E1E24" stroke="#2D2D38" stroke-width="1"/>
  <text x="32" y="338" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="15" font-weight="700">Bengaluru → Hyderabad</text>
  <text x="32" y="358" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="12">NH44 • 569 km • Divided Highway</text>
  <rect x="32" y="368" width="70" height="20" rx="4" fill="#052E16"/>
  <text x="67" y="382" fill="#4ADE80" font-family="Roboto, sans-serif" font-size="10" text-anchor="middle" font-weight="600">RECOMMENDED</text>

  <!-- Route Card 2 -->
  <rect x="16" y="412" width="288" height="88" rx="12" fill="#1E1E24" stroke="#2D2D38" stroke-width="1"/>
  <text x="32" y="438" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="15" font-weight="700">Mumbai → Pune Expressway</text>
  <text x="32" y="458" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="12">94.5 km • Access Controlled • CCTV</text>
  <rect x="32" y="468" width="84" height="20" rx="4" fill="#1E3A8A"/>
  <text x="74" y="482" fill="#93C5FD" font-family="Roboto, sans-serif" font-size="10" text-anchor="middle" font-weight="600">6-LANE EXPRESSWAY</text>

  <!-- Bottom Navigation -->
  <rect x="0" y="570" width="320" height="70" fill="#18181C"/>
  <circle cx="48" cy="596" r="16" fill="#2563EB" opacity="0.2"/>
  <text x="48" y="601" fill="#60A5FA" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle">🏠</text>
  <text x="48" y="626" fill="#60A5FA" font-family="Roboto, sans-serif" font-size="10" text-anchor="middle" font-weight="600">Home</text>

  <text x="112" y="601" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle">🧭</text>
  <text x="112" y="626" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="10" text-anchor="middle">Plan</text>

  <text x="176" y="601" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle">🔖</text>
  <text x="176" y="626" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="10" text-anchor="middle">Saved</text>

  <text x="240" y="601" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="16" text-anchor="middle">🚨</text>
  <text x="240" y="626" fill="#9CA3AF" font-family="Roboto, sans-serif" font-size="10" text-anchor="middle">SOS</text>
</svg>
